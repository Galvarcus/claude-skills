name: Validate Skills

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and test skills
        run: python tools/test.py

      - name: Package skills
        run: python tools/package.py --all

      - name: Upload skill archives
        uses: actions/upload-artifact@v4
        with:
          name: claude-skill-archives
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
